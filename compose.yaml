services:
  app:
    build:
      context: .
      target: development
    init: true
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/home/node
      - /home/node/node_modules
